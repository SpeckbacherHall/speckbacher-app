<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speckbacher</title>
<meta name="description" content="App der Speckbacher Schützenkompanie Hall in Tirol: Ausrückungen und Rückmeldungen">
<meta name="theme-color" content="#4f6c37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speckbacher">
<link rel="preload" href="fonts/Karla.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="letter.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1><img class="logo" src="logo.svg" alt=""><span class="sr">Speckbacher Schützenkompanie Hall in Tirol</span></h1>
      <button class="btn ghost" id="logout" hidden>Abmelden</button>
    </div>
    <div class="seg" role="group" aria-label="Ansicht" id="roles" hidden>
      <button id="role-member" aria-pressed="true">Mitglied</button>
      <button id="role-admin" aria-pressed="false">Admin</button>
    </div>
  </header>
  <main id="view"><p class="empty">Wird geladen …</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="rundschreiben.js"></script>
<script src="geburtstage.js"></script>
<script src="fibel.js"></script>
<script src="abgleich.js"></script>
</body>
</html>
